# Cloudflare Worker config for the multiplayer relay (worker.js).
#
# Deploys to the free *.workers.dev subdomain on the project's own Cloudflare
# account — no custom domain or DNS migration required. The Durable Object uses
# the SQLite backend (new_sqlite_classes), which is the only DO class type the
# Workers Free plan allows.

name = "anu-minecraft-world"
main = "worker.js"
compatibility_date = "2026-06-19"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
