name: Deploy multiplayer relay

# Deploy the Cloudflare Worker relay (worker.js). A push to develop or main first
# re-runs the CI gate (lint + build + unit tests); only when that passes does the
# relay deploy, so a broken build never ships the backend.
#
# The relay is a standalone Worker + SQLite Durable Object (wrangler.toml),
# published to the account's free *.workers.dev subdomain. The static front end
# deploys separately on Vercel and is untouched here.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   — token with the "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  — the target Cloudflare account id

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

# Never cancel an in-flight deploy; serialize per branch.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: CI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  deploy:
    name: Deploy relay
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
